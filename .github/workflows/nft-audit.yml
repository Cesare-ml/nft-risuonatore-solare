name: NFT read-only audit offline tests

on:
  push:
    paths:
      - "scripts/audit-polygon.mjs"
      - "data/opensea/observed-2026-10-21.json"
      - "package.json"
      - ".github/workflows/nft-audit.yml"
  pull_request:
    paths:
      - "scripts/audit-polygon.mjs"
      - "data/opensea/observed-2026-10-21.json"
      - "package.json"
      - ".github/workflows/nft-audit.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check scripts/audit-polygon.mjs
      - name: Offline audit self-test (no network or secrets)
        run: npm run nft:chain:test
