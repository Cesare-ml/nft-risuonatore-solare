name: Check existing IPFS metadata (read only)

on:
  push:
    paths:
      - "scripts/check-ipfs-metadata.mjs"
      - ".github/workflows/ipfs-metadata-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/check-ipfs-metadata.mjs
      - name: Read only four public IPFS metadata documents
        run: node scripts/check-ipfs-metadata.mjs
      - name: Save report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-ipfs-metadata-check
          path: reports/ipfs-existing-metadata.json
          if-no-files-found: warn
          retention-days: 30
