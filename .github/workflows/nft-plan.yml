name: Verify proposed NFT mint plan (offline only)

on:
  push:
    paths:
      - "scripts/plan-next-mints.mjs"
      - "data/opensea/observed-2026-10-21.json"
      - ".github/workflows/nft-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/plan-next-mints.mjs
      - run: node scripts/plan-next-mints.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-nft-proposed-mint-manifest
          path: reports/staging-mint-plan.json
          if-no-files-found: warn
          retention-days: 30
