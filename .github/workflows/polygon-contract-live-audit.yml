name: Polygon ERC1155 live read-only contract check

on:
  push:
    paths:
      - ".github/workflows/polygon-contract-live-audit.yml"
      - "scripts/audit-polygon.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only Polygon RPC audit (no wallet or private keys)
        run: node scripts/audit-polygon.mjs --out reports/polygon-live-audit.json
      - name: Report confirmed RPC observations
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/polygon-live-audit.json', 'utf8'));
          console.log(JSON.stringify({
            contract:r.contract, chain_id:r.chain_id, checked_block:r.checked_block,
            code_bytes:r.contract_code_size_bytes, proxy:r.proxy_detection,
            implementation_code_bytes:r.implementation_code_size_bytes, owner_probe:r.owner_probe,
            interfaces:r.interfaces,
            metadata_uri_results:r.token_uris,
            current_supply:r.current_supply_by_token_id,
            abi_source:r.abi.source, abi_verified:r.abi.verified,
            abi_lookup_address:r.abi.lookup_address,
            implementation_proxy:r.abi.proxy, candidate_functions:r.abi.candidates,
            all_contract_functions:r.abi.functions,
            mint_permission_status:r.assessment.creator_mint_permissions
          },null,2));"
      - name: Preserve audit JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-live-contract-audit
          path: reports/polygon-live-audit.json
          if-no-files-found: warn
          retention-days: 30
