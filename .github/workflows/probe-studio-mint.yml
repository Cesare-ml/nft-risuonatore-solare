name: Probe Studio batch mint (eth_call only)

on:
  push:
    paths:
      - "scripts/probe-studio-mint.mjs"
      - ".github/workflows/probe-studio-mint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary ABI coder
        run: npm install ethers@6 --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Syntax test
        run: node --check scripts/probe-studio-mint.mjs
      - name: Simulate from public owner and configurer (NO transaction broadcast)
        run: node scripts/probe-studio-mint.mjs
