name: Analyze existing OpenSea Studio ERC1155 mints (read-only)

on:
  push:
    paths:
      - "scripts/forensics-opensea.mjs"
      - ".github/workflows/opensea-forensics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/forensics-opensea.mjs
      - name: Read public history, no wallet or tx
        run: node scripts/forensics-opensea.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensea-mint-forensics
          path: reports/opensea-studio-forensics.json
          if-no-files-found: warn
          retention-days: 30
